<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akhshy Ganesh — moved to akhshy.dev</title>
  <meta name="description" content="This page has moved. Find Akhshy Ganesh at akhshy.dev.">
  <link rel="canonical" href="https://akhshy.dev">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #ede7dc;
      --card: #f7f3ea;
      --ink: #2e2a24;
      --ink-soft: #5b554a;
      --olive-deep: #3f4636;
      --clay: #b5674a;
      --denim: #3e5c74;
      --shadow: rgba(46, 42, 36, .28);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #2a2620;
        --card: #33302a;
        --ink: #ede7dc;
        --ink-soft: #c9c2b4;
        --olive-deep: #c9d6b4;
        --clay: #e39775;
        --denim: #8fb2cc;
        --shadow: rgba(0, 0, 0, .5);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--paper);
      background-image:
        radial-gradient(ellipse at 10% -10%, rgba(255, 255, 255, .25), transparent 45%),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, .015) 0px, rgba(0, 0, 0, .015) 1px, transparent 1px, transparent 3px);
      color: var(--ink);
      font-family: Sora, system-ui, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .title-card {
      position: relative;
      background: var(--card);
      padding: 46px 48px 38px;
      border-radius: 3px;
      box-shadow: 0 18px 40px -14px var(--shadow);
      transform: rotate(-1.1deg);
      max-width: 520px;
      text-align: center;
    }
    .tape {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translate(-50%) rotate(-3deg);
      width: 150px;
      height: 46px;
      background: linear-gradient(180deg, #d9cb8ff2, #c9b874e6);
      box-shadow: 0 4px 10px #0000002e;
      opacity: .92;
      pointer-events: none;
    }
    @media (prefers-color-scheme: dark) {
      .tape { background: linear-gradient(180deg, #7a7150f2, #60583ae6); }
    }
    .eyebrow {
      font-size: .8rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--olive-deep);
      font-weight: 700;
      margin: 0 0 14px;
    }
    h1 {
      font-weight: 800;
      font-size: clamp(1.7rem, 4.6vw, 2.4rem);
      line-height: 1.1;
      margin: 0 0 16px;
      letter-spacing: -.01em;
    }
    h1 .accent { color: var(--clay); }
    p { color: var(--ink-soft); margin: 0 0 26px; }
    .marker {
      font-family: Caveat, cursive;
      font-weight: 600;
      font-size: 1.3rem;
      color: var(--clay);
      display: block;
      transform: rotate(-2deg);
      margin-top: 22px;
    }
    .btn {
      display: inline-block;
      background: var(--olive-deep);
      color: var(--card);
      text-decoration: none;
      font-weight: 600;
      padding: 12px 26px;
      border-radius: 3px;
      box-shadow: 0 8px 18px -8px var(--shadow);
      transition: transform .15s ease;
    }
    .btn:hover { transform: translateY(-2px) rotate(.5deg); }
    a:focus-visible { outline: 3px solid var(--denim); outline-offset: 3px; border-radius: 4px; }
  </style>
</head>
<body>
  <main class="title-card">
    <span class="tape" aria-hidden="true"></span>
    <p class="eyebrow">This page has moved</p>
    <h1>You can find me at <span class="accent">akhshy.dev</span></h1>
    <p>This old page is no longer maintained. Everything — projects, writing, and ways to reach me — is on the new site.</p>
    <a class="btn" href="https://akhshy.dev">Take me there →</a>
    <span class="marker">see you on the other side ✦</span>
  </main>
</body>
</html>
